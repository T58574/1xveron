<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cybran-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14171f" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>
    <filter id="amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#222834" stroke-width="8" />

  <!-- Inner accent ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.25" />

  <!-- Cybran V Logo mark -->
  <g filter="url(#amber-glow)">
    <path
      d="M 128 140 L 204 140 L 256 312 L 308 140 L 384 140 L 292 376 C 284 396 268 406 256 406 C 244 406 228 396 220 376 Z"
      fill="url(#cybran-amber)"
    />
